<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Geist+Mono:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #fbfbfb;
        color: #000;
        font-family: "Geist Mono", monospace;
      }
      .frame {
        position: relative;
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        padding: 28px;
      }
      .frame::before {
        content: "";
        position: absolute;
        inset: 14px;
        border: 1px dashed rgba(0, 0, 0, 0.3);
      }
      .striped {
        --c: rgba(0, 0, 0, 0.5);
        height: 34px;
        background: linear-gradient(
          45deg,
          transparent 25%,
          var(--c) 25%,
          var(--c) 50%,
          transparent 50%,
          transparent 75%,
          var(--c) 75%,
          var(--c) 100%
        );
        background-size: 6px 6px;
      }
      .striped.rev {
        background-image: linear-gradient(
          -45deg,
          transparent 25%,
          var(--c) 25%,
          var(--c) 50%,
          transparent 50%,
          transparent 75%,
          var(--c) 75%,
          var(--c) 100%
        );
      }
      .eyebrow {
        display: flex;
        justify-content: space-between;
        padding: 18px 4px 0;
        font-size: 19px;
        letter-spacing: 0.02em;
      }
      .eyebrow .muted {
        color: #6b7280;
      }
      .dot {
        display: inline-block;
        width: 9px;
        height: 9px;
        margin-right: 9px;
        background: #fd5006;
        vertical-align: 1px;
      }
      main {
        display: flex;
        flex: 1;
        flex-direction: column;
        justify-content: center;
        padding: 0 4px;
      }
      h1 {
        max-width: 15ch;
        font-family: "Archivo Black", sans-serif;
        font-size: 82px;
        font-weight: 400;
        line-height: 0.98;
        letter-spacing: -0.03em;
      }
      h1.small {
        font-size: 68px;
        max-width: 18ch;
      }
      em {
        position: relative;
        font-style: normal;
        z-index: 0;
      }
      em::after {
        content: "";
        position: absolute;
        left: 0;
        top: 65%;
        z-index: -1;
        width: 102%;
        height: 28%;
        background-image: radial-gradient(#fd5006 1.4px, transparent 1.4px);
        background-size: 3px 3px;
      }
      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 34px;
      }
      .meta span {
        padding: 7px 11px;
        border: 1px dashed rgba(0, 0, 0, 0.3);
        font-size: 18px;
        line-height: 1;
      }
      footer {
        display: flex;
        justify-content: space-between;
        padding: 0 4px 18px;
        font-size: 19px;
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="striped rev"></div>
      <div class="eyebrow">
        <span><span class="dot"></span>[Wanlin Cheung]</span>
        <span class="muted" id="kicker"></span>
      </div>
      <main>
        <h1 id="title"></h1>
        <div class="meta" id="meta"></div>
      </main>
      <footer>
        <span id="foot"></span>
        <span>ux-portfolio-wl.vercel.app</span>
      </footer>
      <div class="striped"></div>
    </div>

    <script>
      const cards = {
        home: {
          kicker: "UI Designer & Frontend Engineer",
          title: "I <em>design</em> interfaces and write the <em>code</em>.",
          meta: [
            "8+ years",
            "UI & design systems",
            "TypeScript / React",
            "WCAG 2.1 AA",
          ],
          foot: "Singapore",
        },
        tia: {
          kicker: "Case study / 01",
          title: "Tech in Asia Platform Redesign",
          meta: ["Product & UI Design", "Design system", "Web / iOS / Android"],
          foot: "2016—2018",
          small: true,
        },
        nyp: {
          kicker: "Case study / 02",
          title: "NYP Website Redesign",
          meta: ["Frontend Engineering", "TypeScript", "GSAP", "WCAG 2.1 AA"],
          foot: "2023—2025",
        },
        moh: {
          kicker: "Case study / 03",
          title: "MOH Intranet Portal",
          meta: ["UI Design & Frontend", "React / Next.js", "Storybook"],
          foot: "2021—2023",
        },
      };

      const card = cards[location.hash.slice(1)] ?? cards.home;
      document.getElementById("kicker").textContent = card.kicker;
      document.getElementById("title").innerHTML = card.title;
      if (card.small) document.getElementById("title").classList.add("small");
      document.getElementById("meta").innerHTML = card.meta
        .map((m) => `<span>${m}</span>`)
        .join("");
      document.getElementById("foot").textContent = card.foot;
    </script>
  </body>
</html>
